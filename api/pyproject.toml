[project]
name = "ryan-clone-api"
version = "0.1.0"
description = "Backend for Ryan Gomez's digital clone — RAG, persona LLM, voice pipeline."
requires-python = ">=3.11"
authors = [{ name = "Ryan Gomez", email = "ryangomez9965@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    "anthropic>=0.39.0",
    "openai>=1.54.0",

    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    "redis>=5.1.0",
    "diskcache>=5.6.3",

    "sentence-transformers>=3.2.0",
    "torch>=2.4.0",
    "numpy>=1.26.0",

    "langgraph>=0.2.40",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-community>=0.3.0",
    "rank-bm25>=0.2.2",

    "mem0ai>=0.1.30",

    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "sentry-sdk[fastapi]>=2.17.0",

    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",

    "deepgram-sdk>=3.7.0",
    "elevenlabs>=1.10.0",
    "pipecat-ai[silero,deepgram,elevenlabs,websockets]>=0.0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
